services:
    redis:
      image: redis:alpine
      healthcheck:
        test: ["CMD", "/healthchecks/redis.sh"]
        interval: 30s
        timeout: 10s
        retries: 3
      volumes:
      - ./healthchecks:/healthchecks
      networks:
        - back-tier
    
    postgres:
      image: postgres:15-alpine
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: votes
      healthcheck:
        test: ["CMD","/healthchecks/postgres.sh"]
        interval: 30s
        timeout: 10s
        retries: 3
      volumes:
        - db-data:/var/lib/postgresql/data
        - ./healthchecks:/healthchecks
      networks:
        - back-tier
    
    vote:
      image: vote
      deploy:
        replicas: 3
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - back-tier
        - front-tier
    worker:
      image: nouhabk23/worker_image
      depends_on:
        redis:
          condition: service_healthy
        postgres:
          condition: service_healthy
      networks:
        - back-tier
      
    result:
      image: result
      ports:
        - "4000:4000"
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - back-tier
        - front-tier
    seed:
      image: seed1
      depends_on:
        - nginx
      networks:
        - front-tier
    nginx:
      image: nginx4
      ports:
       - "8000:8000"
      depends_on:
        - vote
      networks:
        - front-tier

volumes : 
  db-data :

networks:
  front-tier:
    driver: bridge
  back-tier:
    driver: bridge

    
