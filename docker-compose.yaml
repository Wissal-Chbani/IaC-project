services:
  vote:
    build: ./vote
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - front-net
      - back-net

  redis:
    image: redis:alpine
    volumes:
      - ./healthchecks/:/healthchecks/
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - back-net

  seed-data:
    build: ./seed-data
    depends_on:
      - nginx
    networks:
      - front-net
  
  nginx:
    build: ./nginx
    depends_on:
      - vote
    ports:
      - "8000:8000"
    networks:
      - front-net

networks:
  back-net:
  front-net:
