apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      db: postgres
  template:
    metadata:
      labels:
        db: postgres
    spec:
      initContainers:
        - name: init-cphealthchecks-container
          image: alpine/git:latest
          command:
            - sh
            - -c
            - |
              git clone https://gitlab.imt-atlantique.fr/login-nuage/healthchecks.git /healthchecks &&
              chmod +x /healthchecks/postgres.sh
          volumeMounts:
            - mountPath: /healthchecks
              name: shared-volume
      containers:
        - name: db-container
          image: postgres:15-alpine
          envFrom:
            - configMapRef:
                name: db-configmap
            - secretRef:
                name: db-secrets
          livenessProbe:
            exec:
              command:
                - /healthchecks/postgres.sh
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: shared-volume
              mountPath: /healthchecks

      volumes:
        - name: shared-volume
          emptyDir: {}
          

  